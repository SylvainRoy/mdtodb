[project]
name = "mdtodb"
version = "0.1.0"
description = "Synchronise a pdftomd Markdown output directory into a ChromaDB collection, incrementally."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "chromadb>=1.5,<2",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0,<2.0"]
all = ["mdtodb[gemini]"]

[project.scripts]
mdtodb = "mdtodb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdtodb"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
